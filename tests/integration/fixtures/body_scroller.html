<!DOCTYPE html>
<html>
<head>
  <title>Body scroller</title>
  <style>html, body { height: 100%; margin: 0; } body { overflow-y: auto; }</style>
</head>
<body>
  <div style="position:relative;height:4000px;background:#fff">
    <div style="position:absolute;left:0;right:0;bottom:0;height:200px;background:#f00"></div>
  </div>
  <script>
    window.scrolls = 0;
    addEventListener('scroll', () => { window.scrolls += 1; }, true);
  </script>
</body>
</html>
