<!DOCTYPE html>
<html lang="en">
<head><title>Below the fold</title><style>body { margin: 0; }</style></head>
<body>
  <!-- a viewport point read as a document point lands here once the page scrolls -->
  <button id="danger" style="position: absolute; left: 0; top: 0; width: 400px; height: 600px"
    onclick="document.title = 'deleted'">Delete account</button>
  <button id="cancel" style="position: absolute; left: 20px; top: 1600px; width: 120px; height: 40px"
    onclick="document.title = 'cancelled'">Cancel</button>
</body>
</html>
