<!DOCTYPE html>
<html lang="en">
<head><title>Zoomed frame</title>
<style>
  body { margin: 0; }
  #danger { display: none; position: fixed; left: 150px; top: 90px; width: 120px; height: 60px; z-index: 1; }
  #holder { position: absolute; left: 0; top: 0; }
  #frame { width: 300px; height: 200px; border: 0; }
  #cover { display: none; position: fixed; left: 0; top: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
  <button id="danger" onclick="document.getElementById('status').textContent = 'deleted'">Delete account</button>
  <div id="holder"><iframe id="frame" title="Editor" src="snapshot_zoom_frame.html"></iframe></div>
  <div id="cover" onclick="document.getElementById('status').textContent = 'overlay'"></div>
  <p id="status" style="margin-top: 400px">idle</p>
  <script>
    // ?frame: zoom on the iframe; ?ancestor: zoom on a div holding it; ?cover: an overlay
    const mode = location.search.slice(1);
    // "Delete account" sits where Chrome's quads put Save inside a zoomed frame
    if (mode !== 'cover') document.getElementById('danger').style.display = 'block';
    if (mode === 'frame') document.getElementById('frame').style.zoom = '1.7';
    if (mode === 'ancestor') document.getElementById('holder').style.zoom = '1.5';
    if (mode === 'cover') document.getElementById('cover').style.display = 'block';
  </script>
</body>
</html>
