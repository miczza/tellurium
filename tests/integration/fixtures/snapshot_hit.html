<!DOCTYPE html>
<html lang="en">
<head><title>Hit targets</title>
<style>
  body { margin: 0; }
  #wrap { position: relative; margin: 40px; width: 200px; }
  #glass { position: absolute; inset: 0; pointer-events: none; background: rgba(0, 0, 0, 0.05); }
  .switch { position: relative; display: inline-block; margin: 40px; }
  .switch input { position: absolute; left: 0; top: 0; width: 40px; height: 20px; opacity: 0; margin: 0; }
  .switch label { display: inline-block; position: relative; width: 40px; height: 20px; background: #ccc; }
</style>
</head>
<body>
  <div id="wrap">
    <button id="c4" onclick="document.getElementById('status').textContent = 'c4'">Under glass</button>
    <div id="glass"></div>
  </div>
  <div class="switch"><input id="c2" type="checkbox"><label for="c2" aria-label="Dark mode"></label></div>
  <!-- labels holding another control over the input: a click there is not the input's -->
  <div class="switch"><input id="tc" type="checkbox" aria-label="Accept"><label for="tc"><a
    href="#terms" style="display: block; width: 40px; height: 20px"
    onclick="document.getElementById('status').textContent = 'link'; return false">terms</a></label></div>
  <div class="switch"><input id="td" type="checkbox" aria-label="Notify"><label for="td"><input
    id="od" type="checkbox" aria-label="Other" style="margin: 0; width: 40px; height: 20px"></label></div>
  <p id="status">idle</p>
</body>
</html>
