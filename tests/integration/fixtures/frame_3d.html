<!DOCTYPE html>
<html lang="en">
<head><title>Stage</title>
<style>
  body { margin: 0; }
  /* where the framed page's own coordinates would land if read as this page's */
  #danger { position: absolute; left: 0; top: 0; width: 320px; height: 220px; }
  #zoomer { position: absolute; left: 0; top: 0; }
  #stage { position: absolute; left: 340px; top: 120px; width: 460px; height: 320px; }
  #frame { position: absolute; left: 0; top: 0; width: 440px; height: 300px;
           border: 4px solid #888; padding: 6px; }
</style>
</head>
<body>
  <button id="danger" onclick="document.title = 'deleted'">Delete account</button>
  <div id="zoomer"><div id="stage"><iframe id="frame" title="Widget"></iframe></div></div>
  <script>
    // ?src=URL: the framed page (another host: an OOPIF; the same host: one process)
    // ?perspective=P: CSS perspective on the iframe's parent
    // ?transform=T: a CSS transform on the iframe (3D ones included)
    // ?zoom=Z: CSS zoom on an ancestor of the iframe
    // ?left=X&top=Y&width=W&height=H: where the stage is and how big the iframe is
    const query = new URLSearchParams(location.search);
    const frame = document.getElementById('frame');
    const stage = document.getElementById('stage');
    if (query.has('perspective')) stage.style.perspective = query.get('perspective');
    if (query.has('transform')) frame.style.transform = query.get('transform');
    if (query.has('zoom')) document.getElementById('zoomer').style.zoom = query.get('zoom');
    for (const side of ['left', 'top']) if (query.has(side)) stage.style[side] = query.get(side) + 'px';
    for (const side of ['width', 'height']) if (query.has(side)) frame.style[side] = query.get(side) + 'px';
    frame.src = query.get('src');
  </script>
</body>
</html>
