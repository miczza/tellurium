<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>trap links hidden by paint effects</title>
<script>
  // Every main-world reading the check could make is counted: it must make none.
  window.__touched = 0;
  const count = (proto, name) => {
    const real = proto[name];
    proto[name] = function (...args) { window.__touched++; return real.apply(this, args); };
  };
  count(window, "getComputedStyle");
  count(window, "matchMedia");
  count(Document.prototype, "elementFromPoint");
  count(ShadowRoot.prototype, "elementFromPoint");
  count(Element.prototype, "getBoundingClientRect");
  count(Element.prototype, "getClientRects");
</script>
<style>
  body { margin: 0; font: 14px sans-serif; }
  .row { position: relative; height: 22px; margin: 2px 8px; }
  .cover { position: absolute; inset: 0; background: #fff; }
  .glass { position: absolute; inset: 0; pointer-events: none; }
</style>
</head>
<body>
<!-- traps: every one is in the viewport, with nothing else to tell it -->
<div class="row"><a id="trap-filter" href="/t/filter" style="filter: opacity(0);">filter opacity</a></div>
<div class="row" style="opacity: 0.2;"><a id="trap-faint" href="/t/faint" style="opacity: 0.2;">faint</a></div>
<div class="row"><a id="trap-almost" href="/t/almost" style="opacity: 0.01;">almost gone</a></div>
<div class="row"><a id="trap-mask" href="/t/mask"
  style="mask-image: linear-gradient(transparent, transparent);">mask</a></div>
<div class="row"><a id="trap-webkit-mask" href="/t/webkit-mask"
  style="-webkit-mask-image: linear-gradient(rgba(0, 0, 0, 0), rgba(0, 0, 0, 0));">webkit mask</a></div>
<div class="row" style="contain: paint; height: 0;"><a id="trap-contain" href="/t/contain">contain paint</a></div>
<div class="row" style="contain: strict; width: 200px; height: 0;">
  <a id="trap-strict" href="/t/strict">contain strict</a></div>
<div class="row" style="contain: paint; width: 0; height: 0; position: static;">
  <a id="trap-contain-abs" href="/t/contain-abs" style="position: absolute; top: 0;">absolute in contain</a></div>
<div class="row"><a id="trap-covered" href="/t/covered">covered</a><div class="cover"></div></div>
<div class="row" style="background: #fff;">
  <a id="trap-under" href="/t/under" style="position: relative; z-index: -1;">under the block</a></div>
<!-- normal links that look like them -->
<div class="row" style="opacity: 0.5;"><a id="ok-half" href="/half" style="opacity: 0.5;">half</a></div>
<div class="row"><a id="ok-filter" href="/blur" style="filter: blur(0.5px) opacity(0.8);">filtered</a></div>
<div class="row"><a id="ok-mask" href="/mask"
  style="mask-image: linear-gradient(to right, #000 60%, transparent);">fading out</a></div>
<div class="row" style="contain: paint;"><a id="ok-contain" href="/contain">in a contained box</a></div>
<div class="row"><a id="ok-glass" href="/glass">under glass</a><div class="glass" style="background: rgba(0, 0, 0, 0.05);"></div></div>
<div class="row"><a id="ok-badge" href="/badge" style="position: relative;">badge
  <span style="position: absolute; inset: 0; background: #ffc;">badge</span></a></div>
<div class="row"><a id="ok-wrapped" href="/wrapped" style="display: inline-block; width: 60px;">a link that wraps over lines</a></div>
<div style="height: 3000px;"></div>
<div class="row"><a id="ok-covered-below" href="/below">covered, below the fold</a><div class="cover"></div></div>
</body>
</html>
