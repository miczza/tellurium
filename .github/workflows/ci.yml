name: CI

on:
  push:
    branches: [master, "fetta/**"]
  pull_request:
  workflow_dispatch:
    # A targeted run costs less: one system, and only the given pytest paths.
    inputs:
      os:
        description: "System: all, or one of them"
        type: choice
        default: all
        options: [all, ubuntu-latest, windows-2025, macos-15]
      tests:
        description: "pytest paths, space separated (empty: the whole suites)"
        type: string
        default: ""

concurrency:
  # The event in the group: a manual run does not cancel the push run of its branch.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUFF_VERSION: "0.17.3"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install "ruff==${RUFF_VERSION}"
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format --check
        run: ruff format --check --diff .

  unit:
    name: unit (py${{ matrix.python }})
    if: >-
      github.event_name != 'workflow_dispatch' ||
      (!inputs.tests && (inputs.os == 'all' || inputs.os == 'ubuntu-latest'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Allow Chrome's sandbox
        # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor;
        # Chrome from the tool cache has no AppArmor profile and aborts with
        # "No usable sandbox!".
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[geoip,dev,mcp]"
      - name: Run unit tests
        run: pytest tests/unit -q

  integration:
    name: integration + stealth (chrome)
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.os == 'all' || inputs.os == 'ubuntu-latest'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Chrome (stable)
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Allow Chrome's sandbox
        # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor;
        # Chrome from the tool cache has no AppArmor profile and aborts with
        # "No usable sandbox!".
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[geoip,dev,mcp]"
      - name: Point find_chrome() at setup-chrome's Chrome
        # find_chrome() tries ~/.tellurium/browsers (managed installs) first; the
        # runner image has its own Chromium and Chrome on PATH. The folder name
        # keeps "google-chrome" in the path, which is how tellurium tells a
        # branded Chrome (setup-chrome's stable is one) on Linux.
        env:
          STOCK_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          mkdir -p "$HOME/.tellurium/browsers/google-chrome-stable"
          ln -s "$STOCK_CHROME" "$HOME/.tellurium/browsers/google-chrome-stable/chrome"
      - name: Check the Chrome the tests use
        # find_chrome() picks setup-chrome's Chrome, it launches, and its major is
        # the current stable, as on Windows and macOS.
        env:
          STOCK_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: python -m tests.ci_chrome
      - name: Run integration + stealth tests
        # tests/stealth needs a DISPLAY; tests/integration runs headless against
        # local HTTP servers and discovers Chrome via find_chrome().
        env:
          TESTS: ${{ inputs.tests }}
        run: xvfb-run -a pytest ${TESTS:-tests/integration tests/stealth} -q -rfE --durations=15

  # Windows and macOS: the same events as Linux (the repo is public, minutes are
  # free). A red test blocks as on Linux; a job without its JUnit report also
  # fails the run (see os-results).
  unit-os:
    name: unit (${{ matrix.os }})
    if: >-
      github.event_name != 'workflow_dispatch' ||
      (!inputs.tests && inputs.os != 'ubuntu-latest')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((inputs.os == 'windows-2025' || inputs.os == 'macos-15') && format('["{0}"]', inputs.os) || '["windows-2025", "macos-15"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[geoip,dev,mcp]" pytest-timeout
      - name: Run unit tests
        run: pytest tests/unit -v -rfEs --timeout=120 --junitxml=junit-unit.xml
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-unit-${{ matrix.os }}
          path: junit-unit.xml
          if-no-files-found: ignore

  integration-os:
    name: integration (${{ matrix.os }}, ${{ matrix.shard }}/${{ inputs.tests && 1 || 4 }})
    if: >-
      github.event_name != 'workflow_dispatch' || inputs.os != 'ubuntu-latest'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((inputs.os == 'windows-2025' || inputs.os == 'macos-15') && format('["{0}"]', inputs.os) || '["windows-2025", "macos-15"]') }}
        # The suite takes about 55 min on a hosted runner: four shards balanced
        # on the files' durations (tests/shard.py) end near 14 min each, well
        # inside the 35 min timeout. A targeted run is one job.
        shard: ${{ fromJSON(inputs.tests && '[1]' || '[1, 2, 3, 4]') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Bring the image's Chrome to the current stable (Windows)
        # On Windows setup-chrome takes an installed Chrome as "stable" ("Found in
        # cache"): the image's, often a version behind Linux and macOS. Google's
        # enterprise MSI updates it in place first.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP "chrome.msi"
          Invoke-WebRequest "https://dl.google.com/dl/chrome/install/googlechromestandaloneenterprise64.msi" -OutFile $msi
          $p = Start-Process msiexec.exe -ArgumentList "/i", "`"$msi`"", "/qn", "/norestart" -Wait -PassThru
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { exit $p.ExitCode }
          Get-ChildItem "C:\Program Files\Google\Chrome\Application" -Directory | Select-Object -ExpandProperty Name
      - name: Install Chrome (stable)
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[geoip,dev,mcp]" pytest-timeout
      - name: Second loopback address (macOS)
        # The other_server fixture listens on 127.0.0.2: Linux and Windows route
        # all of 127/8 to loopback, macOS only 127.0.0.1 until aliased.
        if: runner.os == 'macOS'
        run: sudo ifconfig lo0 alias 127.0.0.2 up
      - name: Put setup-chrome's Chrome where find_chrome() looks (macOS)
        # find_chrome() takes /Applications/Google Chrome.app on macOS, the
        # runner image's own Chrome. setup-chrome's bundle goes in its place
        # (same path, so tellurium still sees a branded Chrome). On Windows
        # setup-chrome installs into Program Files, where find_chrome() looks.
        if: runner.os == 'macOS'
        env:
          STOCK_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          app="/Applications/Google Chrome.app"
          root=$(cd "$(dirname "$STOCK_CHROME")/../.." && pwd)
          ls -la "$root/Contents/MacOS"
          if [ ! -e "$root/Contents/MacOS/Google Chrome" ]; then
            ln -s "$(basename "$STOCK_CHROME")" "$root/Contents/MacOS/Google Chrome"
          fi
          if [ -e "$app" ]; then sudo mv "$app" "/Applications/Google Chrome (image).app"; fi
          sudo ln -s "$root" "$app"
      - name: Check the Chrome the tests use
        # find_chrome() must pick setup-chrome's Chrome, which must launch and be
        # the current stable major, the same on the three systems. Fails the job:
        # otherwise the run would not test what it says.
        timeout-minutes: 5
        env:
          STOCK_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: python -m tests.ci_chrome
      - name: Defender real-time scanning off (R3-B experiment, push runs only)
        # Temporary A/B: the push run scans nothing, a manual run on the same commit
        # keeps Defender on; the hang probe's stalls are counted in both.
        if: runner.os == 'Windows' && github.event_name == 'push'
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Continue
          Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled,OnAccessProtectionEnabled | Format-List
      - name: Run integration tests
        # No xvfb-run: Windows and macOS have a display. tests/stealth stays on Linux.
        env:
          STOCK_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          TESTS: ${{ inputs.tests }}
        run: |
          files=${TESTS:-$(python -m tests.shard ${{ matrix.shard }} 4 tests/integration)}
          pytest $files -v -rfEs --timeout=120 --junitxml=junit-integration.xml
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-integration-${{ matrix.os }}-${{ matrix.shard }}
          path: junit-integration.xml
          if-no-files-found: ignore

  os-results:
    # One table for the Windows and macOS jobs (in the run's summary), and a red
    # run when one of them left no JUnit report: cancelled, timed out, or its
    # pytest killed by a timeout, so part of its tests never ran.
    name: results (windows, macos)
    needs: [unit-os, integration-os]
    if: >-
      always() &&
      (github.event_name != 'workflow_dispatch' || inputs.os != 'ubuntu-latest')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: junit-*
          path: reports
      - name: Every job reported
        env:
          CI_OSES: ${{ (inputs.os == 'windows-2025' || inputs.os == 'macos-15') && inputs.os || 'windows-2025 macos-15' }}
          CI_SHARDS: ${{ inputs.tests && 1 || 4 }}
          CI_UNIT: ${{ !inputs.tests && '1' || '0' }}
        run: python -m tests.ci_results reports

  build:
    name: build (sdist + wheel)
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine
      - name: Build sdist + wheel
        run: python -m build
      - name: twine check
        run: twine check --strict dist/*
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
