name: CI

on:
  push:
    branches: [master, "fetta/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUFF_VERSION: "0.17.3"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install "ruff==${RUFF_VERSION}"
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format --check
        run: ruff format --check --diff .

  unit:
    name: unit (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Allow Chrome's sandbox
        # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor;
        # Chrome from the tool cache has no AppArmor profile and aborts with
        # "No usable sandbox!".
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[geoip,dev]"
      - name: Run unit tests
        run: pytest tests/unit -q

  integration:
    name: integration + stealth (chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Chrome (stable)
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Allow Chrome's sandbox
        # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor;
        # Chrome from the tool cache has no AppArmor profile and aborts with
        # "No usable sandbox!".
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[geoip,dev]"
      - name: Point find_chrome() at setup-chrome's Chrome
        # find_chrome() tries ~/.tellurium/browsers (managed installs) first; the
        # runner image has its own Chromium and Chrome on PATH. The folder name
        # keeps "google-chrome" in the path, which is how tellurium tells a
        # branded Chrome (setup-chrome's stable is one) on Linux.
        env:
          STOCK_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          mkdir -p "$HOME/.tellurium/browsers/google-chrome-stable"
          ln -s "$STOCK_CHROME" "$HOME/.tellurium/browsers/google-chrome-stable/chrome"
          python -c "import asyncio; from tellurium.browser.launcher import find_chrome; print('find_chrome:', asyncio.run(find_chrome()))"
      - name: Run integration + stealth tests
        # tests/stealth needs a DISPLAY; tests/integration runs headless against
        # local HTTP servers and discovers Chrome via find_chrome().
        run: xvfb-run -a pytest tests/integration tests/stealth -q -rfE --durations=15

  # Windows and macOS: manual runs and pushes to fetta/C6-* only (macOS minutes
  # count x10, Windows x2 on a private repo). Non-blocking until C6 is merged.
  unit-os:
    name: unit (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/fetta/C6-')
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[geoip,dev]" pytest-timeout
      - name: Run unit tests
        run: pytest tests/unit -v -rfEs --timeout=120 --junitxml=junit-unit.xml
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-unit-${{ matrix.os }}
          path: junit-unit.xml
          if-no-files-found: ignore

  integration-os:
    name: integration (${{ matrix.os }}, ${{ matrix.shard }}/4)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/fetta/C6-')
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
        # About 780 tests take ~40 min on a hosted runner: four shards of
        # files keep each job under its 25 min.
        shard: [1, 2, 3, 4]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Chrome (stable)
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[geoip,dev]" pytest-timeout
      - name: Second loopback address (macOS)
        # The other_server fixture listens on 127.0.0.2: Linux and Windows route
        # all of 127/8 to loopback, macOS only 127.0.0.1 until aliased.
        if: runner.os == 'macOS'
        run: sudo ifconfig lo0 alias 127.0.0.2 up
      - name: Put setup-chrome's Chrome where find_chrome() looks (macOS)
        # find_chrome() takes /Applications/Google Chrome.app on macOS, the
        # runner image's own Chrome. setup-chrome's bundle goes in its place
        # (same path, so tellurium still sees a branded Chrome). On Windows
        # setup-chrome installs into Program Files, where find_chrome() looks.
        if: runner.os == 'macOS'
        env:
          STOCK_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          app="/Applications/Google Chrome.app"
          root=$(cd "$(dirname "$STOCK_CHROME")/../.." && pwd)
          ls -la "$root/Contents/MacOS"
          if [ ! -e "$root/Contents/MacOS/Google Chrome" ]; then
            ln -s "$(basename "$STOCK_CHROME")" "$root/Contents/MacOS/Google Chrome"
          fi
          if [ -e "$app" ]; then sudo mv "$app" "/Applications/Google Chrome (image).app"; fi
          sudo ln -s "$root" "$app"
      - name: Show the Chrome the tests use
        # Warns when find_chrome() would pick another Chrome than setup-chrome's,
        # then launches it once. Never stops the job: the tests still run.
        continue-on-error: true
        timeout-minutes: 5
        env:
          STOCK_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          python - <<'PY'
          import asyncio, os
          from tellurium import Browser
          from tellurium.browser.launcher import find_chrome
          found = asyncio.run(find_chrome())
          stock = os.environ["STOCK_CHROME"]
          print("setup-chrome:", stock)
          print("find_chrome: ", found)
          if os.path.realpath(found) != os.path.realpath(stock):
              print("::warning::find_chrome() picks another Chrome than setup-chrome's")
          async def probe():
              browser = await Browser.launch(headless=True)
              try:
                  print("launched:   ", await browser.main_tab.eval("navigator.userAgent"))
              finally:
                  await browser.close()
          asyncio.run(asyncio.wait_for(probe(), 120))
          PY
      - name: Run integration tests
        # No xvfb-run: Windows and macOS have a display. tests/stealth stays on Linux.
        env:
          STOCK_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          files=$(ls tests/integration/test_*.py | sort | awk -v n=${{ matrix.shard }} 'NR % 4 == n % 4')
          pytest $files -v -rfEs --timeout=120 --junitxml=junit-integration.xml
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-integration-${{ matrix.os }}-${{ matrix.shard }}
          path: junit-integration.xml
          if-no-files-found: ignore

  build:
    name: build (sdist + wheel)
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine
      - name: Build sdist + wheel
        run: python -m build
      - name: twine check
        run: twine check --strict dist/*
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
