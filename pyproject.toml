[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tellurium"
version = "0.1.0"
description = "Tellurium automates browsers. Quietly."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Michele Mazza", email = "mclmza@gmail.com" },
]
requires-python = ">=3.10"
keywords = ["browser", "automation", "scraping", "stealth", "cdp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Libraries",
    "Framework :: AsyncIO",
]
dependencies = []

[project.optional-dependencies]
geoip = ["maxminddb>=2.4"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
tellurium = "tellurium.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["tellurium"]

[tool.hatch.build.targets.sdist]
include = [
  "/tellurium/",
  "/tests/",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "stealth: tests that require network access and external sites",
]

[tool.ruff]
line-length = 100
target-version = "py310"
