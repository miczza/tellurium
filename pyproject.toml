[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tellurium"
version = "0.1.0"
description = "Tellurium automates browsers. Quietly."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Michele Mazza", email = "mclmza@gmail.com" },
]
requires-python = ">=3.10"
keywords = ["browser", "automation", "scraping", "stealth", "cdp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Libraries",
    "Framework :: AsyncIO",
]
dependencies = []

[project.optional-dependencies]
geoip = ["maxminddb>=2.4"]
mcp = ["mcp>=2.3,<3"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
tellurium = "tellurium.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["tellurium"]

[tool.hatch.build.targets.sdist]
include = [
  "/tellurium/",
  "/tests/",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "stealth: tests that require network access and external sites",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# Generated / vendored / reference trees: never linted.
#   tellurium/cdp/domains  -> generated by tellurium/cdp/generator.py
#   tellurium/cdp/protocol.json -> upstream CDP schema
#   tellurium_old, camoufox*, nodriver, opencli, CloakBrowser -> reference sources
#   examples/sessions -> runtime artifacts (gitignored)
extend-exclude = [
    "tellurium/cdp/domains",
    "tellurium/cdp/protocol.json",
    "tellurium_old",
    "camoufox",
    "camoufox_analysis",
    "nodriver",
    "opencli",
    "CloakBrowser",
    "examples/sessions",
    "*.md",   # ruff >= 0.16 formats fenced code blocks in Markdown; docs are prose
    "docs",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE"]
ignore = [
    # Line length is enforced by `ruff format` (line-length = 100 above); E501
    # would only ever fire on long comments/strings/URLs the formatter cannot
    # split, so it is pure noise on top of the formatter.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["BLE001", "B904"]
"examples/*" = ["BLE001"]

[tool.ruff.lint.isort]
known-first-party = ["tellurium"]

[tool.ruff.format]
docstring-code-format = true
